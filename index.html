<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oiioii Studio - Multi-IA Creator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { text-align: center; margin: 25px 0; }
        h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 6px; text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        p.subtitle { color: #94a3b8; font-size: 0.95rem; }
        .studio-container { background: #1e293b; width: 100%; max-width: 650px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        textarea, select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #475569; color: white; font-size: 0.95rem; outline: none; }
        textarea:focus, select:focus { border-color: #38bdf8; }
        button { width: 100%; background: linear-gradient(135deg, #0ea5e9, #6366f1); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.99); }
        .preview-box { margin-top: 20px; background: #0f172a; border: 2px dashed #475569; border-radius: 12px; height: 180px; display: flex; align-items: center; justify-content: center; text-align: center; color: #64748b; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>Oiioii Studio 🚀</h1>
        <p class="subtitle">Creación Inteligente para Colegios, Streamers y Empresas</p>
    </header>

    <div class="studio-container">
        <div class="input-group">
            <label for="category">Selecciona tu categoría:</label>
            <select id="category" onchange="cambiarOpciones()">
                <option value="empresas">🏢 Empresa / Marketing (Publicidad, Logos, Banners)</option>
                <option value="streamer">🎮 Streamer / Creador (Alertas, Overlays, Emotes)</option>
                <option value="escolar">📚 Escolar / Educativo (Animaciones para exposiciones, infografías)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="asset-type">Tipo de proyecto:</label>
            <select id="asset-type">
                <option value="logo">Logotipo corporativo animado</option>
                <option value="banner">Banner publicitario para redes</option>
                <option value="video">Video institucional o comercial</option>
            </select>
        </div>

        <div class="input-group">
            <label for="prompt">Describe tu idea:</label>
            <textarea id="prompt" rows="3" placeholder="Ej: Un diseño moderno y minimalista con tecnología..."></textarea>
        </div>

        <button onclick="generarProyecto()">Crear con IA ✨</button>

        <div class="preview-box" id="preview">
            Tu proyecto generado aparecerá aquí...
        </div>
    </div>

    <script>
        function cambiarOpciones() {
            const cat = document.getElementById('category').value;
            const selectType = document.getElementById('asset-type');
            selectType.innerHTML = "";
            
            if(cat === 'empresas') {
                selectType.innerHTML = `
                    <option value="logo">Logotipo corporativo animado</option>
                    <option value="banner">Banner publicitario para redes</option>
                    <option value="video">Video institucional o comercial</option>
                `;
            } else if(cat === 'streamer') {
                selectType.innerHTML = `
                    <option value="alert">Alertas de Twitch/Kick (Subs y Donaciones)</option>
                    <option value="overlay">Overlay completo para directos</option>
                    <option value="emote">Pack de Emotes personalizados</option>
                `;
            } else {
                selectType.innerHTML = `
                    <option value="animacion">Animación explicativa para tarea/exposición</option>
                    <option value="infografia">Infografía o cartel interactivo</option>
                    <option value="avatar">Avatar o personaje didáctico</option>
                `;
            }
        }

        function generarProyecto() {
            const prompt = document.getElementById('prompt').value;
            const preview = document.getElementById('preview');
            
            if(!prompt.trim()) {
                alert("Por favor escribe una descripción de lo que necesitas.");
                return;
            }

            preview.innerHTML = "⏳ Procesando solicitud con motor IA... <br><span style='color: #38bdf8; font-size: 0.9rem;'>Diseñando elementos a medida...</span>";
            
            setTimeout(() => {
                preview.innerHTML = "🎯 ¡Proyecto generado con éxito! <br><span style='color: #a855f7; font-size: 0.85rem;'>Listo para descargar y usar en tu presentación, empresa o canal.</span>";
            }, 2500);
        }
    </script>

</body>
</html>
