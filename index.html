<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oiioii Studio - Historia Animada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0d1117; color: #f0f6fc; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 70px; }
        
        main { padding: 20px; flex: 1; max-width: 800px; width: 100%; margin: 0 auto; }
        
        /* Caja de bienvenida y creación */
        .hero-box { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        .hero-box h1 { font-size: 1.5rem; margin-bottom: 8px; color: #ffffff; }
        .hero-box p { color: #8b949e; font-size: 0.9rem; margin-bottom: 16px; }
        
        .dropzone { border: 2px dashed #30363d; border-radius: 12px; padding: 20px; text-align: center; background: #0d1117; color: #8b949e; margin-bottom: 16px; cursor: pointer; }
        
        .prompt-input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; color: white; font-size: 0.95rem; resize: none; outline: none; margin-bottom: 12px; }
        .prompt-input:focus { border-color: #58a6ff; }

        .btn-generate { background: linear-gradient(135deg, #238636, #2ea043); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-generate:hover { opacity: 0.9; }

        /* Tarjeta de Destacados */
        .section-title { font-size: 1.1rem; margin-bottom: 12px; color: #e6edf3; }
        .feature-card { background: linear-gradient(135deg, #1f242d, #161b22); border: 1px solid #30363d; border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: border-color 0.2s; }
        .feature-card:hover { border-color: #58a6ff; }
        .feature-card h3 { font-size: 1.1rem; color: #fff; margin-bottom: 4px; }
        .feature-card span { background: #238636; color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }

        /* Barra de navegación inferior */
        nav.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0d1117; border-top: 1px solid #30363d; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #8b949e; font-size: 0.7rem; cursor: pointer; gap: 4px; }
        .nav-item.active { color: #ffffff; }
    </style>
</head>
<body>

    <main>
        <div class="hero-box">
            <h1>Buenos Días, Director.</h1>
            <p>Arrastra o pega una imagen, o escribe tu idea para comenzar a generar tu historia animada.</p>
            
            <div class="dropzone" onclick="alert('Carga multimedia habilitada.')">
                🏞️ Arrastra / pega una imagen aquí
            </div>

            <textarea class="prompt-input" rows="3" id="story-prompt" placeholder="Ej: Un joven héroe descubriendo un portal mágico en una ciudad de neón..."></textarea>
            
            <button class="btn-generate" onclick="crearVideoAnimado()">Empezar a crear video con IA 🎬</button>
        </div>

        <h2 class="section-title">Destacados</h2>
        <div class="feature-card" onclick="alert('Abriendo creador de Historia Animada...')">
            <div>
                <h3>HISTORIA ANIMADA</h3>
                <p style="color: #8b949e; font-size: 0.85rem;">Genera secuencias completas en video.</p>
            </div>
            <span>Crear</span>
        </div>
    </main>

    <!-- Barra de Navegación Inferior -->
    <nav class="bottom-nav">
        <div class="nav-item active">
            <span>🏠</span>
            <span>Explorar</span>
        </div>
        <div class="nav-item">
            <span>📁</span>
            <span>Proyectos</span>
        </div>
        <div class="nav-item">
            <span>👤</span>
            <span>Recursos</span>
        </div>
        <div class="nav-item">
            <span>📖</span>
            <span>Habilidades</span>
        </div>
        <div class="nav-item">
            <span>🚀</span>
            <span>Publicar</span>
        </div>
    </nav>

    <script>
        function crearVideoAnimado() {
            const prompt = document.getElementById('story-prompt').value;
            if(!prompt.trim()) {
                alert("Por favor escribe una idea o descripción para tu historia.");
                return;
            }
            alert("✨ Procesando historia animada: \"" + prompt + "\". Renderizando video...");
        }
    </script>

</body>
</html>
